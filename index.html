<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Google Cloud 資格学習マスター</title>
<meta name="description" content="Cloud Digital Leader / Generative AI Leader 学習アプリ">
<meta name="theme-color" id="meta-theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--blue:#1a73e8;--blue-d:#1557b0;--ink:#202124;--mut:#5f6368;--line:#dadce0;--bg:#f8f9fa;--card:#fff;--ok:#137333;--okbg:#e6f4ea;--ng:#b3261e;--ngbg:#fce8e6;--warn:#b06000;--radius:10px;--track:#e8eaed;--tagbg:#e8f0fe;--diagrambg:#f1f6fe;--diagrambd:#c2d7f5;--svgbox:#d3e3fd;--svgbox2:#a8c7fa;--svgok:#e6f4ea;--svgng:#fce8e6}
:root[data-theme="dark"]{--blue:#8ab4f8;--blue-d:#6ea8f0;--ink:#e8eaed;--mut:#9aa0a6;--line:#3c4043;--bg:#202124;--card:#2d2e30;--ok:#81c995;--okbg:#23402e;--ng:#f28b82;--ngbg:#4a2623;--warn:#fdd663;--track:#3c4043;--tagbg:#26364d;--diagrambg:#26303d;--diagrambd:#3d5a80;--svgbox:#3a4a63;--svgbox2:#31435f;--svgok:#23402e;--svgng:#4a2623}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;overflow-wrap:break-word;word-break:normal}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #8ab4f8;outline-offset:2px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-inner{max-width:960px;margin:0 auto;padding:4px 16px;display:flex;flex-wrap:nowrap;gap:8px;align-items:center}
.app-title{font-size:15px;font-weight:700;margin:0;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-switch{display:flex;flex-wrap:nowrap;gap:0;border:1px solid var(--line);border-radius:999px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;max-width:100%}
.mode-switch::-webkit-scrollbar{display:none}
.mode-switch button{flex:0 0 auto}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.mode-switch button{border:0;background:var(--card);padding:3px 9px;min-height:30px;min-width:0;font-size:13.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.mode-switch button[aria-pressed="true"]{background:var(--blue);color:#fff}
nav.tabs{max-width:960px;margin:0 auto;padding:0 16px 4px;display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 9px;min-height:30px;min-width:0;font-size:13.5px;white-space:nowrap;flex:0 0 auto;color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:960px;margin:0 auto;padding:8px 16px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;margin-bottom:9px}
h2{font-size:17px;margin:0 0 7px} h3{font-size:15px;margin:10px 0 4px}
p{margin:6px 0} ul{margin:6px 0;padding-left:20px} li{margin:2px 0}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:7px}
.stat{background:var(--bg);border-radius:8px;padding:7px 9px}
.stat b{font-size:19px;display:block;line-height:1.3}
.bar{height:7px;background:var(--track);border-radius:99px;overflow:hidden;margin:4px 0 1px}
.bar i{display:block;height:100%;background:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 10px;min-height:32px;min-width:56px;font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:7px 14px;min-height:36px;font-weight:600;min-width:80px}
.btn:hover{background:var(--blue-d)} .btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;align-items:center}
.choice{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:5px 0;background:var(--card);color:var(--ink);width:100%;text-align:left}
.choice input{margin-top:4px;flex:0 0 auto}
.choice span{flex:1 1 auto;min-width:0}
.choice.correct{border-color:var(--ok);background:var(--okbg)} .choice.wrong{border-color:var(--ng);background:var(--ngbg)}
.feedback{border-radius:9px;padding:9px 10px;margin-top:8px}
.feedback.ok{background:var(--okbg)} .feedback.ng{background:var(--ngbg)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:5px}
.tag{background:var(--tagbg);color:var(--blue-d);border-radius:99px;padding:1px 9px;font-size:12.5px;white-space:nowrap}
input[type="search"],input[type="text"]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.term{border-bottom:1px solid var(--line);padding:6px 2px} .term:last-child{border-bottom:0}
.term b{font-size:15px}
.flash{min-height:148px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:7px;cursor:pointer;width:100%;background:var(--card);color:var(--ink);border:2px solid var(--blue);border-radius:var(--radius);padding:14px}
.flash .big{font-size:20px;font-weight:700}
figure.diagram{margin:9px 0;background:var(--diagrambg);border:1px solid var(--diagrambd);border-radius:9px;padding:9px}
figure.diagram svg{width:100%;height:auto;display:block}
figure.diagram figcaption{font-size:13.5px;color:var(--ink);margin-top:5px}
.lesson-item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:5px 0}
.lesson-item span{flex:1 1 220px;min-width:200px}
.timer{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--ng)}
.overview{display:flex;flex-wrap:wrap;gap:5px}
.overview button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0}
.overview button.done{background:var(--tagbg);border-color:var(--blue)} .overview button.cur{outline:3px solid var(--blue)} .overview button.flag{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
table{border-collapse:collapse;width:100%} th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
footer{max-width:960px;margin:0 auto;padding:6px 16px 18px;color:var(--mut);font-size:12px}
.review{border-top:1px solid var(--line);padding:8px 0}
.bmbtn{border:1px solid var(--line);background:var(--card);color:var(--warn);border-radius:999px;padding:3px 10px;min-height:32px;font-size:14px;white-space:nowrap}
.bmbtn[aria-pressed="true"]{background:var(--tagbg);border-color:var(--warn)}
.listrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin:5px 0}
.listrow span{flex:1 1 200px;min-width:160px}
@media (max-width:480px){.top-inner,main{padding-left:12px;padding-right:12px} nav.tabs{padding-left:12px;padding-right:12px} .app-title{font-size:13.5px} .mode-switch button{padding:3px 7px;font-size:12.5px} nav.tabs button{padding:3px 8px;font-size:12.5px} .btn{min-width:0;flex:1 1 auto} .flash .big{font-size:18px} .card{padding:10px} .grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1 class="app-title">Google Cloud 資格学習マスター</h1>
    <div class="mode-switch" id="mode-switch" role="group" aria-label="モード切替"></div>
  </div>
  <nav class="tabs" aria-label="主要メニュー" id="tabs"></nav>
</header>
<main id="view" tabindex="-1"></main>
<footer>
  <p>本アプリの問題・解説は公式試験ガイドの範囲に基づくオリジナル作成です。Google Cloud の公式合格点は公開されていないため、模試の70%は学習上の目安です。製品名・資格名は各権利者の商標です。本アプリは Google とは関係のない学習支援ツールです。</p>
</footer>
<script src="data.js"></script>
<script>
"use strict";
const DATA = window.APP_DATA;
if(!DATA){ document.getElementById('view').innerHTML = '<div class="card"><h2>データを読み込めませんでした</h2><p>data.js が同じフォルダにあるか確認してください。</p></div>'; throw new Error('APP_DATA missing'); }
const MODE_IDS = Object.keys(DATA.meta || {cdl:{}, genai:{}});
const SHORTS = {cdl:'CDL', genai:'GenAI Leader', nlm:'NotebookLM', gcloud:'Google Cloud'};
function shortLabel(id){ const m = DATA.meta[id]||{}; return m.short || SHORTS[id] || id; }
const LS_KEY = 'google-cloud-master:state:v1';
const SCHEMA_VERSION = 2;
const BACKUP_KEY = LS_KEY + ':backup';
const VIEWS = [['dashboard','ダッシュボード'],['lessons','レッスン'],['practice','問題演習'],['review','復習'],['saved','保存'],['mock','模試'],['glossary','用語集'],['cards','フラッシュカード'],['stats','分析'],['settings','設定']];
let state = loadState();
let view = 'dashboard';
let practice = {section:'ALL', idx:0, checked:false, selected:[], listMode:'section', pfilter:'ALL', qid:null, q:'', limit:0, order:null, orderFor:null};
let mock = null; // {ids, answers:{}, idx, endsAt, timerId, submitted, result}
let cardState = {section:'ALL', idx:0, flipped:false};
let glossary = {q:'', section:'ALL'};
let currentLesson = null;

function perMode(make){ const o={}; MODE_IDS.forEach(id=>{ o[id]=make(); }); return o; }
function defaultState(){ return {schemaVersion:SCHEMA_VERSION, mode:'cdl', answers:perMode(()=>({})), known:perMode(()=>[]), mockHistory:[], lessonsRead:perMode(()=>[]), settings:{theme:'system', startMode:'last', shuffleChoices:false}, bookmarks:perMode(()=>[]), mistakes:perMode(()=>[]), srs:perMode(()=>({})), first:perMode(()=>({})), attempts:perMode(()=>({})), cardLevel:perMode(()=>({}))}; }
function backupCorrupt(raw){ try{ if(raw && !localStorage.getItem(BACKUP_KEY)) localStorage.setItem(BACKUP_KEY, raw); }catch(e){} }
function loadState(){ const d = defaultState(); let raw=null; try{ raw = localStorage.getItem(LS_KEY); const s = raw? JSON.parse(raw): null; if(s && s.mode && s.answers){ const merged = Object.assign(d, s); merged.schemaVersion = SCHEMA_VERSION; merged.settings = Object.assign({theme:'system', startMode:'last', shuffleChoices:false}, s.settings||{}); MODE_IDS.forEach(id=>{ merged.answers[id] = (s.answers && s.answers[id] && typeof s.answers[id]==='object')? s.answers[id]:{}; merged.known[id] = (s.known && Array.isArray(s.known[id]))? s.known[id]:[]; merged.lessonsRead[id] = (s.lessonsRead && Array.isArray(s.lessonsRead[id]))? s.lessonsRead[id]:[]; merged.bookmarks[id] = (s.bookmarks && Array.isArray(s.bookmarks[id]))? s.bookmarks[id]:[]; merged.mistakes[id] = (s.mistakes && Array.isArray(s.mistakes[id]))? s.mistakes[id]:[]; merged.srs[id] = (s.srs && s.srs[id] && typeof s.srs[id]==='object')? s.srs[id]:{}; merged.first[id] = (s.first && s.first[id] && typeof s.first[id]==='object')? s.first[id]:{}; merged.attempts[id] = (s.attempts && s.attempts[id] && typeof s.attempts[id]==='object')? s.attempts[id]:{}; merged.cardLevel[id] = (s.cardLevel && s.cardLevel[id] && typeof s.cardLevel[id]==='object')? s.cardLevel[id]:{}; }); if(!Array.isArray(merged.mockHistory)) merged.mockHistory=[]; return merged; } if(raw) backupCorrupt(raw); }catch(e){ backupCorrupt(raw); } return d; }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
/* settings: theme + start mode */
if(MODE_IDS.includes(state.settings.startMode)){ state.mode = state.settings.startMode; }
if(!MODE_IDS.includes(state.mode)){ state.mode = MODE_IDS[0] || 'cdl'; }
const darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : {matches:false};
function resolvedTheme(){ const t = state.settings.theme||'system'; if(t==='dark') return 'dark'; if(t==='light') return 'light'; return darkMQ.matches? 'dark':'light'; }
function applyTheme(){ const th = resolvedTheme(); if(th==='dark') document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme'); const meta=document.getElementById('meta-theme-color'); if(meta) meta.setAttribute('content', th==='dark'? '#202124':'#1a73e8'); }
if(darkMQ.addEventListener) darkMQ.addEventListener('change', ()=>{ if((state.settings.theme||'system')==='system') applyTheme(); });
applyTheme();
/* bookmarks / mistakes helpers */
const bmList = () => state.bookmarks[mode()];
const mkList = () => state.mistakes[mode()];
function toggleBookmark(id){ const a=bmList(); const i=a.indexOf(id); if(i>=0) a.splice(i,1); else a.push(id); save(); }
/* SRS (SM-2系の簡易スケジュール): 間隔ラダー 1→3→7→14→30日、正解で次段へ、最終段の正解で卒業（リストから外れる） */
const SRS_LADDER = [1,3,7,14,30];
function dateStr(offsetDays){ const d=new Date(); d.setDate(d.getDate()+(offsetDays||0)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const srsMap = () => state.srs[mode()];
function recordMistake(id, correct){
  const a=mkList(); const i=a.indexOf(id); const srs=srsMap();
  if(!correct){
    if(i<0) a.push(id);
    srs[id] = {interval:1, due:dateStr(1), reps:0};
  } else {
    const cur = srs[id];
    if(cur){
      const idx = SRS_LADDER.indexOf(cur.interval);
      if(idx<0 || idx>=SRS_LADDER.length-1){ if(i>=0) a.splice(i,1); delete srs[id]; }
      else { const nx = SRS_LADDER[idx+1]; srs[id] = {interval:nx, due:dateStr(nx), reps:(cur.reps||0)+1}; }
    } else if(i>=0){ a.splice(i,1); }
  }
}
function srsDueCount(){ const t=dateStr(0); return mkList().filter(id=>{ const s=srsMap()[id]; return !s || s.due<=t; }).length; }
function recordAttempt(id, correct){
  const f=state.first[mode()]; if(!(id in f)) f[id]=!!correct;
  const at=state.attempts[mode()]; const cur=at[id]||{n:0,ok:0}; cur.n++; if(correct) cur.ok++; at[id]=cur;
}
const mode = () => state.mode;
const M = () => DATA.meta[mode()];
const Qs = () => DATA[mode()].questions;
const Ts = () => DATA[mode()].terms;
const Ls = () => DATA[mode()].lessons;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function isCorrect(q, sel){ const ans = Array.isArray(q.answer)? q.answer : [q.answer]; const s = (sel||[]).slice().sort((x,y)=>x-y); return s.length===ans.length && s.every((v,i)=>v===ans.slice().sort((x,y)=>x-y)[i]); }
function ansText(q){ const ans = Array.isArray(q.answer)? q.answer : [q.answer]; return ans.map(i=>q.choices[i]).join(' / '); }

/* ---------- diagram ---------- */
function diagramSVG(caption){
  const c = caption;
  let boxes = null, kind = 'branch';
  if(/比較|オンプレミス.*クラウド|違い/.test(c)){ kind='compare'; boxes=['オンプレミス','クラウド']; }
  else if(/階層|ヒエラルキー|リソース階層/.test(c)){ kind='stack'; boxes=['組織','フォルダ','プロジェクト','リソース']; }
  else if(/層|レイヤー|landscape|スタック/.test(c)){ kind='stack'; boxes = (c.match(/インフラ|モデル|プラットフォーム|エージェント|アプリ/) ? ['アプリケーション','エージェント','プラットフォーム','モデル','インフラ'] : ['アプリ層','プラットフォーム層','データ層','インフラ層']); }
  else if(/ライフサイクル|サイクル|循環/.test(c)){ kind='flow'; boxes=['データ収集','前処理','学習','デプロイ','運用・監視']; }
  else if(/RAG|検索拡張|グラウンディング|grounding/i.test(c)){ kind='flow'; boxes=['質問','検索（根拠）','基盤モデル','根拠付き回答']; }
  else if(/フロー|流れ|パイプライン|サプライチェーン|手順|ステップ|移行/.test(c)){ kind='flow'; boxes=['入力','処理','保存・分析','活用']; }
  else if(/セキュリティ|防御|多層|責任共有/.test(c)){ kind='stack'; boxes=['アプリ / エージェント','プラットフォーム','データ','インフラ']; }
  else { const words = c.split(/[、・／\/とやからへにをはがの]/).map(x=>x.trim()).filter(x=>x.length>=2 && x.length<=10).slice(0,4); boxes = words.length>=3 ? words : ['概念','仕組み','活用','効果']; }
  let inner='';
  if(kind==='stack'){
    boxes.forEach((b,i)=>{ const y=12+i*44; inner += `<rect x="90" y="${y}" width="220" height="36" rx="8" fill="${i%2?'#a8c7fa':'#d3e3fd'}" stroke="#1a73e8"/><text x="200" y="${y+23}" text-anchor="middle" font-size="14" fill="#202124">${esc(b)}</text>`; });
    return `<svg viewBox="0 0 400 ${boxes.length*44+16}" role="img" aria-label="${esc(caption)}">${inner}</svg>`;
  }
  if(kind==='compare'){
    inner = `<rect x="20" y="30" width="165" height="80" rx="10" fill="#fce8e6" stroke="#b3261e"/><text x="102" y="65" text-anchor="middle" font-size="15" fill="#202124">${esc(boxes[0])}</text><text x="102" y="90" text-anchor="middle" font-size="12" fill="#5f6368">所有・運用負荷大</text><rect x="215" y="30" width="165" height="80" rx="10" fill="#e6f4ea" stroke="#137333"/><text x="297" y="65" text-anchor="middle" font-size="15" fill="#202124">${esc(boxes[1])}</text><text x="297" y="90" text-anchor="middle" font-size="12" fill="#5f6368">利用・拡張が容易</text><text x="200" y="76" text-anchor="middle" font-size="16" fill="#202124">→</text>`;
    return `<svg viewBox="0 0 400 140" role="img" aria-label="${esc(caption)}">${inner}</svg>`;
  }
  if(kind==='flow'){
    const w = Math.floor(380/boxes.length);
    boxes.forEach((b,i)=>{ const x=10+i*w; inner += `<rect x="${x}" y="35" width="${w-10}" height="52" rx="9" fill="#d3e3fd" stroke="#1a73e8"/><text x="${x+(w-10)/2}" y="66" text-anchor="middle" font-size="12.5" fill="#202124">${esc(b)}</text>` + (i<boxes.length-1?`<text x="${x+w-6}" y="66" font-size="14" fill="#202124">›</text>`:''); });
    return `<svg viewBox="0 0 400 120" role="img" aria-label="${esc(caption)}">${inner}</svg>`;
  }
  inner = `<circle cx="200" cy="70" r="30" fill="#1a73e8"/><text x="200" y="75" text-anchor="middle" font-size="13" fill="#fff">中核</text>`;
  boxes.slice(0,4).forEach((b,i)=>{ const pos=[[55,25],[290,25],[55,105],[290,105]][i]; inner += `<line x1="200" y1="70" x2="${pos[0]+45}" y2="${pos[1]+14}" stroke="#1a73e8"/><rect x="${pos[0]}" y="${pos[1]}" width="90" height="28" rx="8" fill="#d3e3fd" stroke="#1a73e8"/><text x="${pos[0]+45}" y="${pos[1]+19}" text-anchor="middle" font-size="12" fill="#202124">${esc(b)}</text>`; });
  return `<svg viewBox="0 0 400 150" role="img" aria-label="${esc(caption)}">${inner}</svg>`;
}
function renderBody(body){
  const parts = String(body).split(/(\[図:[^\]]+\])/g);
  let html='';
  for(const part of parts){
    const fm = part.match(/^\[図:\s*(.+)\]$/);
    if(fm){ html += `<figure class="diagram">${diagramSVG(fm[1])}<figcaption>図：${esc(fm[1])}</figcaption></figure>`; continue; }
    for(const block of part.split(/\n{2,}/)){
      const lines = block.split(/\n/).map(x=>x.trim()).filter(Boolean);
      if(!lines.length) continue;
      if(lines.length===1 && lines[0].startsWith('## ')){ html += `<h3>${esc(lines[0].slice(3))}</h3>`; continue; }
      if(lines.every(l=>l.startsWith('- '))){ html += '<ul>' + lines.map(l=>`<li>${esc(l.slice(2))}</li>`).join('') + '</ul>'; continue; }
      // mixed block: headings/lists inline
      let buf=[];
      const flush=()=>{ if(buf.length){ html += `<p>${esc(buf.join(' '))}</p>`; buf=[]; } };
      for(const l of lines){
        if(l.startsWith('## ')){ flush(); html += `<h3>${esc(l.slice(3))}</h3>`; }
        else if(l.startsWith('- ')){ flush(); html += `<ul><li>${esc(l.slice(2))}</li></ul>`; }
        else buf.push(l);
      } flush();
    }
  }
  return html;
}

function practiceList(){
  let list;
  if(practice.listMode==='bookmarks') list = Qs().filter(q=>bmList().includes(q.id));
  else if(practice.listMode==='review'){ list = Qs().filter(q=>mkList().includes(q.id)); list.sort((a,b)=>{ const da=(srsMap()[a.id]||{}).due||'9999'; const db=(srsMap()[b.id]||{}).due||'9999'; return da<db? -1: da>db? 1:0; }); }
  else list = practice.section==='ALL'? Qs() : Qs().filter(q=>q.section===practice.section);
  if(practice.listMode==='section' && practice.pfilter!=='ALL'){
    const rec = state.answers[mode()]; const at = state.attempts[mode()];
    if(practice.pfilter==='DONE') list = list.filter(q=>!!rec[q.id]);
    else if(practice.pfilter==='TODO') list = list.filter(q=>!rec[q.id]);
    else if(practice.pfilter==='WEAK') list = list.filter(q=>{ const a=at[q.id]; return a && a.ok<a.n; });
  }
  if(practice.q){ const needle = practice.q.toLowerCase(); list = list.filter(q=>q.question.toLowerCase().includes(needle)); }
  if(practice.limit>0) list = list.slice(0, practice.limit);
  if(practice.checked && practice.qid && !list.some(q=>q.id===practice.qid)){
    const cur = Qs().find(q=>q.id===practice.qid); if(cur) list = [cur].concat(list);
  }
  return list;
}

/* ---------- mock ---------- */
const isExam = () => !!M().mockDistribution;
function buildMockIds(){
  if(!isExam()){
    const total = Math.min(30, Qs().length); const qs = Qs();
    const secs = Object.keys(M().sections).filter(s=>qs.some(q=>q.section===s));
    let ids=[]; let assigned=0; const counts={};
    secs.forEach((s,i)=>{ const c=qs.filter(q=>q.section===s).length; counts[s] = i===secs.length-1? total-assigned : Math.min(c, Math.round(total*c/qs.length)); assigned+=counts[s]; });
    secs.forEach(s=>{ ids = ids.concat(shuffle(qs.filter(q=>q.section===s)).slice(0, Math.max(0,counts[s])).map(q=>q.id)); });
    if(ids.length>total) ids=ids.slice(0,total);
    if(ids.length<total){ const rest=shuffle(qs.filter(q=>!ids.includes(q.id))); ids=ids.concat(rest.slice(0,total-ids.length).map(q=>q.id)); }
    return shuffle(ids);
  }
  const dist = M().mockDistribution; let ids=[];
  for(const s of Object.keys(dist)){ ids = ids.concat(shuffle(Qs().filter(q=>q.section===s)).slice(0, dist[s]).map(q=>q.id)); }
  return shuffle(ids);
}
function stopMockTimer(){ if(mock && mock.timerId){ clearInterval(mock.timerId); mock.timerId=null; } }

function fmtTime(ms){ ms=Math.max(0,ms); const s=Math.ceil(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function submitMock(timeout){

function renderMockResult(){
  const r = mock.result; const exam = isExam();
  viewEl.innerHTML = `<section class="card"><h2>${exam? '模試結果':'総合テスト結果'}${r.timeout?'（時間切れ）':''}</h2>
  ${exam? `<p style="font-size:19px"><b>${r.correct} / ${mock.ids.length} 問 ・ ${r.score}%</b>　${r.score>=70? '合格目安（70%）以上です' : '合格目安（70%）まであと少しです'}</p>`
  : `<p style="font-size:19px"><b>${r.correct} / ${mock.ids.length} 問 ・ 正答率 ${r.score}%</b></p>`}
  <table><thead><tr><th>セクション</th><th>正解 / 出題</th><th>正答率</th></tr></thead><tbody>
  ${Object.keys(M().sections).filter(s=>r.per[s]).map(s=>`<tr><td>${s} ${esc(M().sections[s])}</td><td>${r.per[s].ok} / ${r.per[s].n}</td><td>${Math.round(r.per[s].ok/r.per[s].n*100)}%</td></tr>`).join('')}
  </tbody></table>
  <div class="btnrow"><button class="btn sec" id="again">${exam? '模試トップへ':'テストトップへ'}</button></div></section>
  <section class="card"><h2>全問レビュー</h2>
  ${mock.ids.map((id,i)=>{ const q=Qs().find(x=>x.id===id); const sel=mock.answers[id]||[]; const ok=isCorrect(q,sel); const bmed=bmList().includes(id); return `<div class="review"><div class="qmeta"><span class="tag">${q.section}</span><span class="tag">${ok?'正解':'不正解'}</span><button type="button" class="bmbtn" data-bm="${esc(id)}" aria-pressed="${bmed}" aria-label="この問題をブックマーク">${bmed?'★ 保存済み':'☆ 保存'}</button></div><p><b>${i+1}. ${esc(q.question)}</b></p><p>あなたの回答：${sel.length? sel.map(x=>esc(q.choices[x])).join(' / '):'（無回答）'}<br>正解：${esc(ansText(q))}<br><span class="mut">${esc(q.explanation)}</span></p></div>`; }).join('')}
  </section>`;
  document.getElementById('again').addEventListener('click',()=>{ mock=null; render(); });
  viewEl.querySelectorAll('[data-bm]').forEach(b=>b.addEventListener('click',()=>{ toggleBookmark(b.dataset.bm); render(); }));
}

/* ---------- review (mistakes) ---------- */
function renderReview(){
  const t = dateStr(0);
  const ids = mkList().slice().sort((a,b)=>{ const da=(srsMap()[a]||{}).due||'9999'; const db=(srsMap()[b]||{}).due||'9999'; return da<db? -1: da>db? 1:0; });
  const qs = ids.map(id=>Qs().find(q=>q.id===id)).filter(Boolean);
  const dueN = srsDueCount();
  viewEl.innerHTML = `<section class="card"><h2>復習リスト（${qs.length}問）</h2>
  ${qs.length? `<div class="qmeta"><span class="tag">期限到来 ${dueN}問</span><span class="mut">間隔反復：正解するごとに 1→3→7→14→30日 と間隔が伸び、最終段の正解で卒業します</span></div><div class="btnrow" style="margin:0 0 6px"><button class="btn" id="review-start">復習を開始する</button></div>
  ${qs.map(q=>{ const s=srsMap()[q.id]; const dueTxt = s? (s.due<=t? '期限到来':'次回 '+s.due)+' ・ 間隔'+s.interval+'日' : '期限到来'; return `<div class="listrow"><span><span class="tag">${q.section}</span> ${esc(q.question.slice(0,60))}${q.question.length>60?'…':''}<br><span class="mut">${dueTxt}</span></span><button type="button" class="btn sec" data-jump="${esc(q.id)}">この問題</button><button type="button" class="bmbtn" data-drop="${esc(q.id)}">外す</button></div>`; }).join('')}`
  : '<p class="mut">復習リストは空です。演習・模試で間違えた問題がここにたまります。</p>'}
  </section>`;
  const st=document.getElementById('review-start'); if(st) st.addEventListener('click',()=>startPractice('review'));
  viewEl.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>startPractice('review', b.dataset.jump)));
  viewEl.querySelectorAll('[data-drop]').forEach(b=>b.addEventListener('click',()=>{ const a=mkList(); const i=a.indexOf(b.dataset.drop); if(i>=0) a.splice(i,1); delete srsMap()[b.dataset.drop]; save(); render(); }));
}

/* ---------- saved (bookmarks) ---------- */
function renderSaved(){
  const ids = bmList(); const qs = ids.map(id=>Qs().find(q=>q.id===id)).filter(Boolean);
  viewEl.innerHTML = `<section class="card"><h2>保存した問題（${qs.length}問）</h2>
  ${qs.length? `<div class="btnrow" style="margin:0 0 6px"><button class="btn" id="saved-start">保存した問題だけ演習する</button></div>
  ${qs.map(q=>`<div class="listrow"><span><span class="tag">${q.section}</span> ${esc(q.question.slice(0,60))}${q.question.length>60?'…':''}</span><button type="button" class="btn sec" data-jump="${esc(q.id)}">演習する</button><button type="button" class="bmbtn" data-unbm="${esc(q.id)}" aria-label="ブックマークを外す">★ 外す</button></div>`).join('')}`
  : '<p class="mut">保存した問題はまだありません。演習や模試レビューの「☆ 保存」で追加できます。</p>'}
  </section>`;
  const st=document.getElementById('saved-start'); if(st) st.addEventListener('click',()=>startPractice('bookmarks'));
  viewEl.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>startPractice('bookmarks', b.dataset.jump)));
  viewEl.querySelectorAll('[data-unbm]').forEach(b=>b.addEventListener('click',()=>{ toggleBookmark(b.dataset.unbm); render(); }));
}

/* ---------- stats ---------- */
function renderStats(){
  const f = state.first[mode()]; const at = state.attempts[mode()];
  const fIds = Object.keys(f); const fOk = fIds.filter(id=>f[id]).length;
  let rN=0, rOk=0, tN=0, tOk=0;
  Object.keys(at).forEach(id=>{ const a=at[id]; tN+=a.n; tOk+=a.ok; if(a.n>=2){ rN += a.n-1; rOk += a.ok - (f[id]?1:0); } });
  const st = sectionStats();
  const pct = (a,b)=> b? Math.round(a/b*100):0;
  viewEl.innerHTML = `<section class="card"><h2>分析（${esc(M().label)}）</h2>
  <div class="grid">
    <div class="stat"><span class="mut">初見正答率</span><b>${fIds.length? pct(fOk,fIds.length)+'%':'—'}</b><span class="mut">${fIds.length}問に初挑戦</span></div>
    <div class="stat"><span class="mut">再挑戦正答率</span><b>${rN? pct(rOk,rN)+'%':'—'}</b><span class="mut">2回目以降 ${rN} 回</span></div>
    <div class="stat"><span class="mut">通算正答率</span><b>${tN? pct(tOk,tN)+'%':'—'}</b><span class="mut">全 ${tN} 回の回答</span></div>
    <div class="stat"><span class="mut">復習の卒業</span><b>${Object.keys(state.srs[mode()]).length? srsDueCount()+'問が期限到来':'—'}</b><span class="mut">復習リスト ${mkList().length}問</span></div>
  </div></section>
  <section class="card"><h3>セクション別 到達度</h3>
  ${st.map(x=>`<div><div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between"><span>${x.s} ${esc(M().sections[x.s])}</span><span class="mut">到達 ${x.cover}%（${x.done}/${x.total}問）・ 正答率 ${x.rate}%</span></div><div class="bar" role="progressbar" aria-valuenow="${x.cover}" aria-valuemin="0" aria-valuemax="100" aria-label="${x.s} 到達度"><i style="width:${x.cover}%"></i></div></div>`).join('')}
  </section>`;
}

/* ---------- settings ---------- */
function renderSettings(){
  const th = state.settings.theme||'system'; const sm = state.settings.startMode||'last';
  const chip=(key,val,label,cur)=>`<button type="button" data-set="${key}" data-val="${val}" aria-pressed="${cur===val}">${label}</button>`;
  viewEl.innerHTML = `<section class="card"><h2>設定</h2>
  <h3>テーマ</h3>
  <div class="chips" role="group" aria-label="テーマ">${chip('theme','light','ライト',th)}${chip('theme','dark','ダーク',th)}${chip('theme','system','端末に合わせる',th)}</div>
  <h3>起動時に開くモード</h3>
  <div class="chips" role="group" aria-label="起動時に開くモード">${MODE_IDS.map(id=>chip('startMode',id,shortLabel(id),sm)).join('')}${chip('startMode','last','前回のモード',sm)}</div>
  <h3>演習</h3>
  <div class="chips" role="group" aria-label="演習の設定"><button type="button" id="set-shuffle" aria-pressed="${!!state.settings.shuffleChoices}">選択肢シャッフル：${state.settings.shuffleChoices?'ON':'OFF'}</button></div>
  <h3>記録の管理</h3>
  <div class="btnrow" style="margin-top:4px">
    <button class="btn sec" id="set-export">エクスポート（JSON）</button>
    <label class="btn sec" for="set-import-file" style="cursor:pointer">インポート</label>
    <input type="file" id="set-import-file" accept="application/json,.json" style="display:none">
    <button class="btn sec" id="set-reset">初期化</button>
  </div>
  </section>`;
  viewEl.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>{ state.settings[b.dataset.set]=b.dataset.val; save(); applyTheme(); render(); }));
  document.getElementById('set-shuffle').addEventListener('click',()=>{ state.settings.shuffleChoices=!state.settings.shuffleChoices; save(); render(); });
  document.getElementById('set-export').addEventListener('click',()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'google-cloud-master-state.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  });
  document.getElementById('set-import-file').addEventListener('change',e=>{
    const file = e.target.files && e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ try{ const s = JSON.parse(String(reader.result)); if(!s || !s.mode || !s.answers) throw new Error('invalid'); try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(state)); }catch(_){} localStorage.setItem(LS_KEY, JSON.stringify(s)); state = loadState(); save(); applyTheme(); stopMockTimer(); mock=null; view='settings'; render(); alert('インポートしました。'); }catch(_){ alert('読み込めませんでした。現在の記録はそのままです。'); } };
    reader.readAsText(file);
  });
  document.getElementById('set-reset').addEventListener('click',()=>{ if(!confirm('学習記録をすべて初期化しますか？')) return; try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(state)); localStorage.removeItem(LS_KEY); localStorage.removeItem(MOCK_LS); }catch(_){} state = defaultState(); stopMockTimer(); mock=null; view='settings'; save(); applyTheme(); render(); });
}

/* ---------- glossary ---------- */
function renderGlossary(){
  const list = Ts().filter(t=> (glossary.section==='ALL'||t.section===glossary.section) && (!glossary.q || (t.term+' '+(t.reading||'')+' '+t.definition).toLowerCase().includes(glossary.q.toLowerCase())));
  viewEl.innerHTML = `<section class="card"><h2>用語集（${Ts().length}語）</h2>
  <label class="mut" for="gq">検索</label><input type="search" id="gq" value="${esc(glossary.q)}" placeholder="用語・読み・説明で検索" autocomplete="off">
  ${sectionChips(glossary.section)}
  <p class="mut">${list.length} 件</p>
  ${list.map(t=>`<div class="term"><b>${esc(t.term)}</b>${t.reading?` <span class="mut">（${esc(t.reading)}）</span>`:''} <span class="tag">${t.section}</span><br>${esc(t.definition)}</div>`).join('') || '<p>該当する用語がありません。</p>'}
  </section>`;
  const input=document.getElementById('gq');
  input.addEventListener('input',()=>{ glossary.q=input.value; const pos=input.selectionStart; renderGlossary(); const n=document.getElementById('gq'); n.focus(); n.setSelectionRange(pos,pos); });
  bindChips(s=>{glossary.section=s; render();});
}

/* ---------- flashcards ---------- */
function cardList(){ return cardState.section==='ALL'? Ts() : Ts().filter(t=>t.section===cardState.section); }
function renderCards(){
  const list = cardList();
  if(!list.length){ viewEl.innerHTML = `<section class="card"><h2>フラッシュカード</h2>${sectionChips(cardState.section)}<p>該当する用語がありません。</p></section>`; bindChips(s=>{cardState.section=s;cardState.idx=0;cardState.flipped=false;render();}); return; }
  cardState.idx = Math.min(cardState.idx, list.length-1);
  const t = list[cardState.idx]; const lv = state.cardLevel[mode()][t.term];
  viewEl.innerHTML = `<section class="card"><h2>フラッシュカード</h2>${sectionChips(cardState.section)}
  <p class="mut">${cardState.idx+1} / ${list.length} ・ 覚えた ${state.known[mode()].length} 語 ・ カードをタップ（または Enter / Space）で反転</p>
  <button type="button" class="flash" id="flash" aria-label="フラッシュカードを反転">
    ${cardState.flipped? `<span class="mut">${t.section} ${esc(M().sections[t.section]||'')}</span><span>${esc(t.definition)}</span>` : `<span class="big">${esc(t.term)}</span>${t.reading?`<span class="mut">${esc(t.reading)}</span>`:''}<span class="tag">${t.section}</span>`}
  </button>
  <div class="btnrow">
    <button class="btn sec" id="cprev" ${cardState.idx===0?'disabled':''}>前へ</button>
    <button class="btn sec" id="cshuffle">シャッフル</button>
    <button class="btn sec" id="cnext" ${cardState.idx>=list.length-1?'disabled':''}>次へ</button>
  </div>
  <div class="btnrow" role="group" aria-label="自己評価">
    <button class="btn sec" data-lv="0" aria-pressed="${lv===0}">知らない</button>
    <button class="btn sec" data-lv="1" aria-pressed="${lv===1}">あいまい</button>
    <button class="btn" data-lv="2" aria-pressed="${lv===2}">知ってる</button>
  </div></section>`;
  bindChips(s=>{cardState.section=s;cardState.idx=0;cardState.flipped=false;render();});
  document.getElementById('flash').addEventListener('click',()=>{cardState.flipped=!cardState.flipped; render(); document.getElementById('flash').focus();});
  document.getElementById('cprev').addEventListener('click',()=>{cardState.idx--; cardState.flipped=false; render();});
  document.getElementById('cnext').addEventListener('click',()=>{cardState.idx++; cardState.flipped=false; render();});
  document.getElementById('cshuffle').addEventListener('click',()=>{ cardState.idx = Math.floor(Math.random()*list.length); cardState.flipped=false; render(); });
  viewEl.querySelectorAll('[data-lv]').forEach(b=>b.addEventListener('click',()=>{ const v=Number(b.dataset.lv); state.cardLevel[mode()][t.term]=v; const arr=state.known[mode()]; const i=arr.indexOf(t.term); if(v===2){ if(i<0) arr.push(t.term); } else if(i>=0) arr.splice(i,1); save(); render(); }));
}

render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
